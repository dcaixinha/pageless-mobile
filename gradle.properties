org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Skips the configuration phase when nothing that feeds it has changed. Gradle
# tracks the inputs app/build.gradle.kts reads at configuration time — the
# version.properties file, Gradle properties and environment variables — so the
# release workflow's VERSION_NAME/VERSION_CODE overrides still invalidate the
# entry correctly. Verified before enabling; see the closed beads issue pm-dm4.
org.gradle.configuration-cache=true
